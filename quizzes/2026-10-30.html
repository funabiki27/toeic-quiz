<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC Part 6 弱点特訓クイズ (全5問)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --correct: #10b981;
      --wrong: #ef4444;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex items-center justify-center">
  <div class="w-full max-w-2xl bg-[var(--card-bg)] border border-[var(--border-color)] rounded-2xl shadow-2xl p-6 sm:p-8">
    
    <!-- トップへ戻るリンク -->
    <div class="mb-4">
      <a href="../index.html" class="inline-flex items-center text-xs font-semibold text-[var(--accent)] hover:underline">
        <span>← クイズ一覧に戻る</span>
      </a>
    </div>

    <!-- ヘッダー / 進捗 -->
    <div class="flex items-center justify-between border-b border-[var(--border-color)] pb-4 mb-6">
      <div>
        <span class="text-xs uppercase tracking-wider text-[var(--accent)] font-bold">公式11 Test 1 Part 6</span>
        <h1 class="text-xl sm:text-2xl font-bold mt-1">弱点5問 瞬殺特訓</h1>
      </div>
      <div class="text-right">
        <span id="progress-text" class="text-sm font-semibold text-[var(--text-muted)]">第 1 問 / 5 問</span>
        <div class="w-28 sm:w-36 bg-slate-700 h-2 rounded-full mt-2 overflow-hidden">
          <div id="progress-bar" class="bg-[var(--accent)] h-full transition-all duration-300" style="width: 20%;"></div>
        </div>
      </div>
    </div>

    <!-- クイズ本体 -->
    <div id="quiz-container">
      <!-- 問題文 -->
      <div class="mb-6">
        <span id="question-category" class="inline-block px-2.5 py-1 text-xs font-semibold rounded-md bg-blue-900/60 text-blue-300 border border-blue-700/50 mb-3">カテゴリ</span>
        <p id="question-text" class="text-lg sm:text-xl font-medium leading-relaxed"></p>
      </div>

      <!-- 選択肢ボタン -->
      <div id="options-container" class="space-y-3 mb-6"></div>

      <!-- 解説ボックス（初期状態は非表示） -->
      <div id="explanation-container" class="hidden rounded-xl p-5 border transition-all duration-200 mb-6">
        <div id="explanation-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold mb-3"></div>
        <div id="explanation-content" class="text-sm sm:text-base leading-relaxed space-y-2"></div>
      </div>

      <!-- 次へボタン -->
      <div class="flex justify-end">
        <button id="next-btn" class="hidden px-6 py-2.5 rounded-xl font-bold bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-white shadow-lg shadow-blue-500/20 transition-all flex items-center space-x-2">
          <span>次の問題へ</span>
          <span>→</span>
        </button>
      </div>
    </div>

    <!-- 終了画面（初期状態は非表示） -->
    <div id="result-screen" class="hidden text-center py-6">
      <div id="result-emoji" class="text-6xl mb-4">🎉</div>
      <h2 class="text-2xl font-bold mb-2">特訓完了！</h2>
      <p id="final-score" class="text-3xl font-extrabold text-[var(--accent)] mb-4">5 / 5</p>
      <p id="score-comment" class="text-[var(--text-muted)] text-sm sm:text-base mb-6 px-4">
        素晴らしい集中力です！間違えた弱点ポイントを完璧にマスターしました。
      </p>

      <!-- アクションボタン -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <button onclick="copyResults()" class="w-full sm:w-auto px-6 py-3 rounded-xl font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center space-x-2">
          <span>📋</span>
          <span>結果をコピー</span>
        </button>
        <button onclick="restartQuiz()" class="w-full sm:w-auto px-6 py-3 rounded-xl font-bold bg-slate-700 hover:bg-slate-600 text-white transition-all">
          もう一度解く
        </button>
        <a href="../index.html" class="w-full sm:w-auto px-6 py-3 rounded-xl font-bold border border-slate-600 hover:bg-slate-800 text-slate-300 transition-all inline-block text-center">
          一覧へ戻る
        </a>
      </div>

      <!-- コピートースト通知 -->
      <div id="copy-toast" class="hidden mt-4 text-xs font-semibold text-emerald-400 bg-emerald-950/80 border border-emerald-800 py-2 px-4 rounded-lg inline-block">
        ✓ クリップボードに結果をコピーしました！チャットに貼り付けられます
      </div>
    </div>

  </div>

  <script>
    const questions = [
      {
        id: 1,
        category: "文法・現在進行形",
        text: "Is someone you know ------- an important birthday, anniversary, or graduation? Help them to mark the occasion with a unique present.",
        options: [
          "(A) celebrate",
          "(B) celebrating",
          "(C) celebration",
          "(D) celebrated"
        ],
        answer: 1,
        rule: "文全体の構造は「Is [someone you know] [celebrating] ...?」です。主語は関係代名詞が省略された「someone (whom) you know（あなたが知っている誰か）」という名詞のカタマリで、文頭に Is があるため「Is S + V-ing ...?」の現在進行形の疑問文を作ります。「お祝いをする予定ですか？」という近い未来の確定的な予定を表し、(B) celebrating が正解です。(A) celebrate（動詞原形）は Is の直後には置けません。",
        tips: "【秒殺技】Is [someone you know] ...? の主語カタマリを見抜く！Is と結びつくのは celebrating（進行形）！"
      },
      {
        id: 2,
        category: "品詞・コロケーション",
        text: "The delivery service was excellent and exceeded my ------- in every way.",
        options: [
          "(A) expects",
          "(B) expected",
          "(C) expecting",
          "(D) expectations"
        ],
        answer: 3,
        rule: "所有格「my」の後ろには必ず【名詞】が必要です。選択肢の中で名詞は接尾辞 -tion を持つ (D) expectations（期待）のみです。「exceed one's expectations」は「〜の期待を上回る、期待を超える」という意味の超頻出ビジネスコロケーションです。(A) expects は三人称単数動詞、(B) は過去形/過去分詞、(C) は現在分詞/動名詞。",
        tips: "【秒殺技】所有格 my の後ろ ➡️ 名詞！「exceed one's expectations（期待を上回る）」は瞬殺フレーズ！"
      },
      {
        id: 3,
        category: "副詞・文脈判断",
        text: "Due to the system setup, online accounts will be unavailable. However, customers will ------- be able to contact the support team by phone during this time.",
        options: [
          "(A) still",
          "(B) then",
          "(C) moreover",
          "(D) therefore"
        ],
        answer: 0,
        rule: "「オンラインは利用できなくなるが、電話での問い合わせは【依然として／引き続き】可能である」という文脈です。「依然として〜できる」と継続・限定を表す副詞は (A) still です。(C) moreover（さらに、その上）は同方向の追加情報を述べる際に使うため、制限事項の後に「こちらは可能」と対比・継続を述べる文脈には合いません。(B) then（それから）、(D) therefore（それゆえに）。",
        tips: "【秒殺技】「〇〇はできないが、〜は【依然として/引き続き】できる」の文脈 ➡️ still を選ぶ！"
      },
      {
        id: 4,
        category: "副詞・文脈転換",
        text: "Our clients have been telling us for years that we need a presence in Asia. -------, we are better able to meet their needs.",
        options: [
          "(A) Otherwise",
          "(B) Now",
          "(C) Meanwhile",
          "(D) Already"
        ],
        answer: 1,
        rule: "直前で「アジアでのプレゼンスが必要だと言われ続けてきた（そして買収が成立した）」と述べ、文頭で「【今や（Now）】、私たちは彼らのニーズにより良く応えられるようになった」と現状の好転・変化を表しています。(A) Otherwise（さもなければ）は仮定・条件に反する展開に用いるため不適。(C) Meanwhile（その間に、一方）、(D) Already（すでに）。",
        tips: "【秒殺技】過去の状況から「今や〜できるようになった」と現状・変化を導く文頭の副詞 ➡️ Now！"
      },
      {
        id: 5,
        category: "語彙問題",
        text: "While the company did not specify the financial amount of the corporate acquisition, analysts agree the ------- was worth over $100 million.",
        options: [
          "(A) product",
          "(B) campaign",
          "(C) transaction",
          "(D) building"
        ],
        answer: 2,
        rule: "企業買収（acquisition）のニュースにおいて、1億ドル（約150億円）を超える規模の「取引・売買」を指す単語は (C) transaction です。(A) product（製品）単体の価格ではなく、企業買収というビジネス上の「取引」全体を指しています。(B) campaign（キャンペーン）、(D) building（建物）。",
        tips: "【秒殺技】M&A（企業買収）や巨額の金銭が動く文脈で「取引」を表す語 ➡️ transaction！"
      }
    ];

    let currentQuestionIdx = 0;
    let score = 0;
    let userAnswers = [];

    function renderQuestion() {
      const q = questions[currentQuestionIdx];
      
      document.getElementById("progress-text").textContent = `第 ${currentQuestionIdx + 1} 問 / ${questions.length} 問`;
      document.getElementById("progress-bar").style.width = `${((currentQuestionIdx + 1) / questions.length) * 100}%`;
      
      document.getElementById("question-category").textContent = q.category;
      document.getElementById("question-text").textContent = q.text;

      const optContainer = document.getElementById("options-container");
      optContainer.innerHTML = "";

      document.getElementById("explanation-container").classList.add("hidden");
      document.getElementById("next-btn").classList.add("hidden");

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700/80 transition-all font-medium text-slate-100 flex items-center justify-between group";
        btn.innerHTML = `
          <span>${opt}</span>
          <span class="status-icon font-bold text-lg"></span>
        `;
        btn.onclick = () => selectOption(idx);
        optContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIdx) {
      const q = questions[currentQuestionIdx];
      const isCorrect = selectedIdx === q.answer;

      if (isCorrect) score++;

      const selectedLetter = q.options[selectedIdx].split(" ")[0];
      const correctLetter = q.options[q.answer].split(" ")[0];
      userAnswers.push({
        id: q.id,
        isCorrect: isCorrect,
        selectedLetter: selectedLetter,
        correctLetter: correctLetter
      });

      const optionBtns = document.getElementById("options-container").children;
      for (let i = 0; i < optionBtns.length; i++) {
        const btn = optionBtns[i];
        btn.disabled = true;
        btn.classList.remove("hover:bg-slate-700/80");

        if (i === q.answer) {
          btn.classList.add("border-emerald-500", "bg-emerald-950/60", "text-emerald-200");
          btn.querySelector(".status-icon").textContent = "✓";
        } else if (i === selectedIdx && !isCorrect) {
          btn.classList.add("border-rose-500", "bg-rose-950/60", "text-rose-200");
          btn.querySelector(".status-icon").textContent = "✕";
        } else {
          btn.classList.add("opacity-50");
        }
      }

      const expContainer = document.getElementById("explanation-container");
      const badge = document.getElementById("explanation-badge");
      const content = document.getElementById("explanation-content");

      expContainer.classList.remove("hidden");

      if (isCorrect) {
        expContainer.className = "rounded-xl p-5 border border-emerald-800/60 bg-emerald-950/30 mb-6";
        badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold mb-3 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
        badge.textContent = "⭕️ 正解！";
      } else {
        expContainer.className = "rounded-xl p-5 border border-rose-800/60 bg-rose-950/30 mb-6";
        badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold mb-3 bg-rose-500/20 text-rose-300 border border-rose-500/40";
        badge.textContent = `❌ 不正解（正解: ${q.options[q.answer].split(" ")[0]}）`;
      }

      content.innerHTML = `
        <p class="text-slate-200">${q.rule}</p>
        <div class="mt-3 p-3 bg-slate-900/80 rounded-lg border border-slate-700/60 text-amber-300 text-xs sm:text-sm font-semibold">
          💡 ${q.tips}
        </div>
      `;

      const nextBtn = document.getElementById("next-btn");
      nextBtn.classList.remove("hidden");
      if (currentQuestionIdx === questions.length - 1) {
        nextBtn.querySelector("span:first-child").textContent = "結果を見る";
      }
    }

    document.getElementById("next-btn").onclick = () => {
      currentQuestionIdx++;
      if (currentQuestionIdx < questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      document.getElementById("quiz-container").classList.add("hidden");
      const resultScreen = document.getElementById("result-screen");
      resultScreen.classList.remove("hidden");

      document.getElementById("final-score").textContent = `${score} / ${questions.length}`;

      const percentage = Math.round((score / questions.length) * 100);
      let comment = "";
      let emoji = "🎯";

      if (percentage === 100) {
        emoji = "🏆";
        comment = "完璧です！Part 6で落とした5つの弱点をすべて撃破しました！本番でも瞬時に正解が見抜けます。";
      } else if (percentage >= 80) {
        emoji = "✨";
        comment = "素晴らしい得点力！700点突破水準をしっかりクリアしています。間違えた問題の秒殺技だけ確認しておきましょう。";
      } else if (percentage >= 60) {
        emoji = "💪";
        comment = "あと一歩！品詞のカタマリ見極めや文脈副詞の使い分けを再確認して、満点を目指しましょう。";
      } else {
        emoji = "🔥";
        comment = "伸び代たっぷりです！解説の秒殺ポイントをしっかり復習して、もう一度チャレンジしてみましょう。";
      }

      document.getElementById("result-emoji").textContent = emoji;
      document.getElementById("score-comment").textContent = comment;
    }

    function copyResults() {
      const wrongList = userAnswers.filter(a => !a.isCorrect).map(a => `Q${a.id}(${a.selectedLetter}→正解${a.correctLetter})`);
      const correctList = userAnswers.filter(a => a.isCorrect).map(a => `Q${a.id}`);
      const text = `【公式11 Test 1 Part 6 復習クイズ (10/30) 結果】\nスコア: ${score} / ${questions.length}問正解 (${Math.round((score/questions.length)*100)}%)\n⭕️ 正解: ${correctList.join(", ") || "なし"}\n❌ ミス: ${wrongList.join(", ") || "全問正解！"}`;
      
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById("copy-toast");
        toast.classList.remove("hidden");
        setTimeout(() => toast.classList.add("hidden"), 3000);
      }).catch(() => {
        alert("コピーに失敗しました。手動でメモしてください。");
      });
    }

    function restartQuiz() {
      currentQuestionIdx = 0;
      score = 0;
      userAnswers = [];
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("quiz-container").classList.remove("hidden");
      document.getElementById("next-btn").querySelector("span:first-child").textContent = "次の問題へ";
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
