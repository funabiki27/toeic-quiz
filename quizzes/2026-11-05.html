<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC Part 5 弱点特訓クイズ (全13問)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --correct: #10b981;
      --wrong: #ef4444;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex items-center justify-center">
  <div class="w-full max-w-2xl bg-[var(--card-bg)] border border-[var(--border-color)] rounded-2xl shadow-2xl p-6 sm:p-8">
    
    <!-- トップへ戻るリンク -->
    <div class="mb-4">
      <a href="../index.html" class="inline-flex items-center text-xs font-semibold text-[var(--accent)] hover:underline">
        <span>← クイズ一覧に戻る</span>
      </a>
    </div>

    <!-- ヘッダー / 進捗 -->
    <div class="flex items-center justify-between border-b border-[var(--border-color)] pb-4 mb-6">
      <div>
        <span class="text-xs uppercase tracking-wider text-[var(--accent)] font-bold">公式11 Test 2 Part 5</span>
        <h1 class="text-xl sm:text-2xl font-bold mt-1">弱点13問 瞬殺特訓</h1>
      </div>
      <div class="text-right">
        <span id="progress-text" class="text-sm font-semibold text-[var(--text-muted)]">第 1 問 / 13 問</span>
        <div class="w-28 sm:w-36 bg-slate-700 h-2 rounded-full mt-2 overflow-hidden">
          <div id="progress-bar" class="bg-[var(--accent)] h-full transition-all duration-300" style="width: 7.7%;"></div>
        </div>
      </div>
    </div>

    <!-- クイズ本体 -->
    <div id="quiz-container">
      <!-- 問題文 -->
      <div class="mb-6">
        <span id="question-category" class="inline-block px-2.5 py-1 text-xs font-semibold rounded-md bg-blue-900/60 text-blue-300 border border-blue-700/50 mb-3">カテゴリ</span>
        <p id="question-text" class="text-lg sm:text-xl font-medium leading-relaxed"></p>
      </div>

      <!-- 選択肢ボタン -->
      <div id="options-container" class="space-y-3 mb-6"></div>

      <!-- 解説ボックス（初期状態は非表示） -->
      <div id="explanation-container" class="hidden rounded-xl p-5 border transition-all duration-200 mb-6">
        <div id="explanation-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold mb-3"></div>
        <div id="explanation-content" class="text-sm sm:text-base leading-relaxed space-y-2"></div>
      </div>

      <!-- 次へボタン -->
      <div class="flex justify-end">
        <button id="next-btn" class="hidden px-6 py-2.5 rounded-xl font-bold bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-white shadow-lg shadow-blue-500/20 transition-all flex items-center space-x-2">
          <span>次の問題へ</span>
          <span>→</span>
        </button>
      </div>
    </div>

    <!-- 終了画面（初期状態は非表示） -->
    <div id="result-screen" class="hidden text-center py-6">
      <div id="result-emoji" class="text-6xl mb-4">🎉</div>
      <h2 class="text-2xl font-bold mb-2">特訓完了！</h2>
      <p class="text-[var(--text-muted)] mb-6">お疲れ様でした！Test 2 Part 5のミス問を完全攻略しました。</p>
      
      <div class="bg-slate-900/80 rounded-xl p-6 border border-slate-700/60 max-w-sm mx-auto mb-6">
        <div class="text-xs uppercase tracking-wider text-[var(--text-muted)] font-bold">正解数</div>
        <div id="final-score" class="text-4xl font-extrabold text-[var(--accent)] mt-1">0 / 13</div>
        <p id="score-comment" class="text-sm text-slate-300 mt-3"></p>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <button onclick="copyResults()" class="w-full sm:w-auto px-6 py-2.5 rounded-xl font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 transition-all flex items-center justify-center space-x-2">
          <span>📋 結果をコピー</span>
        </button>
        <button onclick="restartQuiz()" class="w-full sm:w-auto px-6 py-2.5 rounded-xl font-bold bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-white shadow-lg shadow-blue-500/20 transition-all">
          もう一度挑戦する
        </button>
      </div>
      <p id="copy-toast" class="text-xs text-emerald-400 mt-3 hidden">クリップボードにコピーしました！</p>
    </div>

  </div>

  <script>
    const questions = [
      {
        id: 101,
        category: "前置詞（期間 vs 期限）",
        text: "The new microwave for the office kitchen should arrive ------- the week.",
        options: [
          "(A) on",
          "(B) along",
          "(C) by",
          "(D) within"
        ],
        answer: 3,
        rule: "「within + 期間（ある時間の幅）」で「〜以内に、〜のうちに」を表します。空所直後の the week は「今週という1週間の期間の幅」なので within the week が正解。(C) by は「by Friday」や「by the end of the week」のように期限の『ある1点』を示す名詞を従えます。",
        tips: "【秒殺技】直後が『期間の幅（the week, 3 days等）』なら within！『具体的な曜日・締め切り時点』なら by！"
      },
      {
        id: 102,
        category: "代名詞の格（make + O + C）",
        text: "Mr. Samudio thanked the hotel staff for making ------- stay a comfortable one.",
        options: [
          "(A) he",
          "(B) his",
          "(C) him",
          "(D) himself"
        ],
        answer: 1,
        rule: "ここでの stay は動詞ではなく【名詞（滞在）】です。文構造は make + [his stay] (O) + [a comfortable one] (C) の第5文型（S+V+O+C）で、「彼の滞在を快適なものにする」という意味。名詞 stay を修飾する所有格の his が正解です。(C) him だと使役動詞に見えますが、後ろの a comfortable one が宙に浮いてしまいます。",
        tips: "【秒殺技】making [ 所有格 ] stay a comfortable one！stay が名詞なので直前は所有格（his）一択！"
      },
      {
        id: 104,
        category: "接続詞（名詞節を導く whether）",
        text: "At the beginning of the class, your instructor will inform you ------- additional materials are needed.",
        options: [
          "(A) yet",
          "(B) whether",
          "(C) however",
          "(D) although"
        ],
        answer: 1,
        rule: "「inform + 人 + 名詞節（人に〜を知らせる）」の構文。空所後ろの additional materials are needed（完全文）を従えて動詞 inform の目的語（名詞節）を作れる接続詞は (B) whether（〜かどうか）のみです。(D) although は副詞節を作るため目的語になれず、(C) however は副詞です。",
        tips: "【秒殺技】inform + 人 + [ whether / that ] S + V！人に〜を知らせる名詞節を作れるのは whether！"
      },
      {
        id: 107,
        category: "形容詞語彙・コロケーション",
        text: "Employees who work part-time are not ------- for the company's profit-sharing plan.",
        options: [
          "(A) famous",
          "(B) admired",
          "(C) reasonable",
          "(D) eligible"
        ],
        answer: 3,
        rule: "「be eligible for + 名詞（〜の資格がある、〜の対象となる）」はTOEIC頻出度100%の超重要コロケーション！パートタイム従業員は利益分配制度の「対象にならない」という文脈に合致する (D) eligible が正解です。",
        tips: "【秒殺技】be eligible for 名詞 / be eligible to do（〜の資格がある）を見たら秒で eligible をマーク！"
      },
      {
        id: 109,
        category: "動詞の語法（V + O + to do）",
        text: "Residents of Miller Street ------- city council members to approve the installation of a traffic light.",
        options: [
          "(A) encouraged",
          "(B) suggested",
          "(C) argued",
          "(D) reported"
        ],
        answer: 0,
        rule: "空所後ろの構造は [city council members] (O) + [to approve ...] (to do)。この『V + O + to do（Oに〜するよう促す）』の形を取れるのは (A) encouraged のみです。suggest / argue / report は that 節を取る動詞であり、『suggest + 人 + to do』という形は絶対に取れません！",
        tips: "【秒殺技】後ろが [人] + to do ➡️ encourage / remind / allow などの促し動詞！suggest は人+to do不可！"
      },
      {
        id: 111,
        category: "副詞語彙（動詞修飾）",
        text: "Chef Ferguson ------- mixed the spices during her cooking demonstration.",
        options: [
          "(A) extremely",
          "(B) expertly",
          "(C) tightly",
          "(D) finely"
        ],
        answer: 1,
        rule: "動詞 mixed（混ぜ合わせた）を修飾する副詞。(B) expertly（巧みに、熟練の腕前で）が料理長の調理デモの文脈に最も合致します。(A) extremely は程度を表す副詞で形容詞・副詞を修飾するのが基本であり、mixed を直接修飾するのは不自然です。",
        tips: "【秒殺技】シェフが腕を振るって「巧みに・手際よく」混ぜる ➡️ expertly mix！"
      },
      {
        id: 114,
        category: "動詞の態（仮定法現在の受動態）",
        text: "Ms. Liu requested that her mail be ------- to the New York office during the month of June.",
        options: [
          "(A) forward",
          "(B) forwards",
          "(C) forwarded",
          "(D) forwarding"
        ],
        answer: 2,
        rule: "request that S + (should) be + 過去分詞 の構文。主語の her mail（郵便物）は「転送される」受動の関係なので、be の後ろには過去分詞の (C) forwarded（転送される）が入ります。(D) forwarding だと能動（進行形）になり不適です。",
        tips: "【秒殺技】mail be [ 過去分詞 ]！郵便物は「転送される（受動態）」ものなので forwarded 一択！"
      },
      {
        id: 115,
        category: "前置詞（場所の広がり）",
        text: "Supeck Legal is closed while the sprinkler system is being replaced ------- the building.",
        options: [
          "(A) into",
          "(B) to",
          "(C) throughout",
          "(D) among"
        ],
        answer: 2,
        rule: "スプリンクラー交換工事が建物全体で行われていることを表す前置詞。「throughout + 場所」で「〜の至る所で、〜の全域で」という意味を表す (C) throughout が正解です。(D) among は3つ以上の複数名詞を従えるため単数名詞 the building には使えません。",
        tips: "【秒殺技】throughout the building / throughout the facility（建物・施設全域で）の超頻出フレーズ！"
      },
      {
        id: 119,
        category: "動詞語彙（受動態と主語の呼応）",
        text: "Although a date has not been -------, the Culvert Silver Line is expected to resume operations next year.",
        options: [
          "(A) positioned",
          "(B) perfected",
          "(C) specified",
          "(D) amplified"
        ],
        answer: 2,
        rule: "主語 a date（日程、日付）と受動態で呼応する動詞。日付は「明記される、具体的に指定される」ものなので、(C) specified（specify: 具体的に述べる、明記する）が正解です。(A) position は「位置づける」、(B) perfect は「完成させる」、(D) amplify は「増幅する」。",
        tips: "【秒殺技】a date has not been specified（日程はまだ明記されていない）のセット表現！"
      },
      {
        id: 121,
        category: "品詞問題（形容詞修飾の副詞）",
        text: "Dr. Cheon is ------- reluctant to accept new patients at this time given his current caseload.",
        options: [
          "(A) understandably",
          "(B) understandable",
          "(C) understanding",
          "(D) understood"
        ],
        answer: 0,
        rule: "文構造は Dr. Cheon (S) is (V) [ ------- ] reluctant (C: 形容詞) to accept...。すでに S+V+C の完全な文が成立しており、直後の形容詞 reluctant（消極的で、気が進まない）を前から修飾できるのは副詞の (A) understandably（当然のことながら、無理からぬことに）のみです。",
        tips: "【秒殺技】be + [ 副詞 (-ly) ] + 形容詞！完成文の形容詞の前は副詞の指定席！"
      },
      {
        id: 122,
        category: "限定詞の語法（単数名詞との呼応）",
        text: "------- customer will receive a free gift with any purchase at Trayton Tools on its opening day.",
        options: [
          "(A) Certain",
          "(B) All",
          "(C) Few",
          "(D) Each"
        ],
        answer: 3,
        rule: "空所直後の名詞 customer は【単数可算名詞（-s がない）】です。(A) Certain, (B) All, (C) Few はいずれも後ろに【複数名詞】を従えます。単数名詞を直接修飾できるのは (D) Each（各顧客、個々の客）のみです！",
        tips: "【秒殺技】直後が単数名詞（customer）➡️ Each / Every！All / Certain / Few は複数名詞！0秒殺！"
      },
      {
        id: 126,
        category: "否定の倒置構文",
        text: "The clients could not agree on contract wording, and unfortunately, ------- could the lawyers.",
        options: [
          "(A) perhaps",
          "(B) meanwhile",
          "(C) neither",
          "(D) rather"
        ],
        answer: 2,
        rule: "前文の否定（could not agree）を受けて「〜もまた…ない」と同調する表現。空所後ろが could (助動詞) + the lawyers (S) と疑問文と同じ語順に【倒置】しているため、否定の倒置を導く (C) neither（neither could S = Sもまた…できなかった）が正解です。",
        tips: "【秒殺技】否定文の後に and [ neither ] + 助動詞 + S！「Sもまた〜ない」の倒置パターンを見抜く！"
      },
      {
        id: 128,
        category: "副詞語彙（動詞修飾）",
        text: "Mr. Lee ended the department meeting ------- in order to greet a prominent client.",
        options: [
          "(A) hardly",
          "(B) widely",
          "(C) immensely",
          "(D) abruptly"
        ],
        answer: 3,
        rule: "動詞 ended（終了させた）を修飾する副詞。「重要顧客を出迎えるために、部署会議を【突然に／急きょ】終了させた」という文脈から (D) abruptly（突然に、不意に、急きょ）が正解。(C) immensely は「非常に、大いに」（immensely popular 等）で動詞 end の修飾には不自然です。",
        tips: "【秒殺技】会議を急きょ切り上げる ➡️ end the meeting abruptly！"
      }
    ];

    let currentQuestionIdx = 0;
    let score = 0;
    let userAnswers = [];

    function renderQuestion() {
      const q = questions[currentQuestionIdx];
      document.getElementById("progress-text").textContent = `第 ${currentQuestionIdx + 1} 問 / ${questions.length} 問`;
      document.getElementById("progress-bar").style.width = `${((currentQuestionIdx + 1) / questions.length) * 100}%`;
      document.getElementById("question-category").textContent = q.category;
      document.getElementById("question-text").textContent = q.text;

      const optContainer = document.getElementById("options-container");
      optContainer.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700/80 transition-all font-medium flex items-center justify-between group";
        btn.innerHTML = `
          <span class="text-slate-200 group-hover:text-white">${opt}</span>
          <span class="status-icon text-lg font-bold"></span>
        `;
        btn.onclick = () => selectOption(idx);
        optContainer.appendChild(btn);
      });

      document.getElementById("explanation-container").classList.add("hidden");
      document.getElementById("next-btn").classList.add("hidden");
    }

    function selectOption(selectedIdx) {
      const q = questions[currentQuestionIdx];
      const isCorrect = selectedIdx === q.answer;
      if (isCorrect) score++;

      const selectedLetter = q.options[selectedIdx].split(" ")[0];
      const correctLetter = q.options[q.answer].split(" ")[0];
      userAnswers.push({
        id: q.id,
        isCorrect: isCorrect,
        selectedLetter: selectedLetter,
        correctLetter: correctLetter
      });

      const optionBtns = document.getElementById("options-container").children;
      for (let i = 0; i < optionBtns.length; i++) {
        const btn = optionBtns[i];
        btn.disabled = true;
        btn.classList.remove("hover:bg-slate-700/80");

        if (i === q.answer) {
          btn.classList.add("border-emerald-500", "bg-emerald-950/60", "text-emerald-200");
          btn.querySelector(".status-icon").textContent = "✓";
        } else if (i === selectedIdx && !isCorrect) {
          btn.classList.add("border-rose-500", "bg-rose-950/60", "text-rose-200");
          btn.querySelector(".status-icon").textContent = "✕";
        } else {
          btn.classList.add("opacity-50");
        }
      }

      const expContainer = document.getElementById("explanation-container");
      const badge = document.getElementById("explanation-badge");
      const content = document.getElementById("explanation-content");

      expContainer.classList.remove("hidden");

      if (isCorrect) {
        expContainer.className = "rounded-xl p-5 border border-emerald-800/60 bg-emerald-950/30 mb-6";
        badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold mb-3 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
        badge.textContent = "⭕️ 正解！";
      } else {
        expContainer.className = "rounded-xl p-5 border border-rose-800/60 bg-rose-950/30 mb-6";
        badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold mb-3 bg-rose-500/20 text-rose-300 border border-rose-500/40";
        badge.textContent = `❌ 不正解（正解: ${q.options[q.answer].split(" ")[0]}）`;
      }

      content.innerHTML = `
        <p class="text-slate-200">${q.rule}</p>
        <div class="mt-3 p-3 bg-slate-900/80 rounded-lg border border-slate-700/60 text-amber-300 text-xs sm:text-sm font-semibold">
          💡 ${q.tips}
        </div>
      `;

      const nextBtn = document.getElementById("next-btn");
      nextBtn.classList.remove("hidden");
      if (currentQuestionIdx === questions.length - 1) {
        nextBtn.querySelector("span:first-child").textContent = "結果を見る";
      }
    }

    document.getElementById("next-btn").onclick = () => {
      currentQuestionIdx++;
      if (currentQuestionIdx < questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      document.getElementById("quiz-container").classList.add("hidden");
      const resultScreen = document.getElementById("result-screen");
      resultScreen.classList.remove("hidden");

      document.getElementById("final-score").textContent = `${score} / ${questions.length}`;

      const percentage = Math.round((score / questions.length) * 100);
      let comment = "";
      let emoji = "🎯";

      if (percentage === 100) {
        emoji = "🏆";
        comment = "完璧です！Test 2 Part 5のミス問13問をすべて秒殺できるようになりました！本番でも確実に拾えます。";
      } else if (percentage >= 80) {
        emoji = "✨";
        comment = "素晴らしい！700点突破ラインを余裕で超えています。間違えた問題の秒殺技だけサッと再確認しておきましょう。";
      } else if (percentage >= 60) {
        emoji = "💪";
        comment = "あと一歩！動詞の語法（suggest vs encourage）や限定詞（Each+単数）を見直して満点を目指しましょう。";
      } else {
        emoji = "🔥";
        comment = "伸び代抜群です！解説の秒殺ポイントをしっかり頭に入れて、もう一度チャレンジしてみましょう。";
      }

      document.getElementById("result-emoji").textContent = emoji;
      document.getElementById("score-comment").textContent = comment;
    }

    function copyResults() {
      const wrongList = userAnswers.filter(a => !a.isCorrect).map(a => `Q${a.id}(${a.selectedLetter}→正解${a.correctLetter})`);
      const correctList = userAnswers.filter(a => a.isCorrect).map(a => `Q${a.id}`);
      const text = `【公式11 Test 2 Part 5 復習クイズ (11/05) 結果】\nスコア: ${score} / ${questions.length}問正解 (${Math.round((score/questions.length)*100)}%)\n⭕️ 正解: ${correctList.join(", ") || "なし"}\n❌ ミス: ${wrongList.join(", ") || "全問正解！"}`;
      
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById("copy-toast");
        toast.classList.remove("hidden");
        setTimeout(() => toast.classList.add("hidden"), 3000);
      }).catch(() => {
        alert("コピーに失敗しました。手動でメモしてください。");
      });
    }

    function restartQuiz() {
      currentQuestionIdx = 0;
      score = 0;
      userAnswers = [];
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("quiz-container").classList.remove("hidden");
      document.getElementById("next-btn").querySelector("span:first-child").textContent = "次の問題へ";
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
